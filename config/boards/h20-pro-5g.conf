# H20-Pro-5G Board Configuration
# Device: Hechuang H20 Pro 5G
# SoC: Allwinner H616
# Architecture: ARM64 (sunxi64)
# Basic board information
BOARD_NAME="H20 Pro 5G"
BOARDFAMILY="sun50iw9"
BOOTCONFIG="h20_pro_5g_defconfig"
SERIALCON="ttyS0"
KERNEL_TARGET="current,edge"
BOOT_FDT_FILE="sun50i-h616-h20-pro-5g.dtb"
OVERLAY_PREFIX="sun50i-h616"

# U-Boot
BOOTBRANCH="tag:v2024.01"
BOOTPATCHDIR="v2024.01"
BOOTSCRIPT="boot.cmd:boot.scr"

# ATF (ARM Trusted Firmware) Settings
ATF_PLAT="sun50i_h616"
ATF_TARGET_MAP='PLAT=sun50i_h616 DEBUG=1 bl31;;build/sun50i_h616/debug/bl31.bin'

enable_extension "radxa-aic8800"
AIC8800_TYPE="sdio"

# Boot partition filesystem
BOOTFS_TYPE="fat"